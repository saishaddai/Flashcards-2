name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      RUN_BUILD: ${{ steps.set-toggles.outputs.RUN_BUILD }}
      RUN_UNIT_TEST: ${{ steps.set-toggles.outputs.RUN_UNIT_TEST }}
      RUN_INSTRUMENTED_TEST: ${{ steps.set-toggles.outputs.RUN_INSTRUMENTED_TEST }}
      RUN_RELEASE_SIGNING: ${{ steps.set-toggles.outputs.RUN_RELEASE_SIGNING }}
      RUN_TEST_REPORTS: ${{ steps.set-toggles.outputs.RUN_TEST_REPORTS }}
    steps:
      - id: set-toggles
        run: |
          echo "RUN_BUILD=true" >> $GITHUB_OUTPUT
          echo "RUN_UNIT_TEST=true" >> $GITHUB_OUTPUT
          echo "RUN_INSTRUMENTED_TEST=false" >> $GITHUB_OUTPUT
          echo "RUN_RELEASE_SIGNING=false" >> $GITHUB_OUTPUT
          echo "RUN_TEST_REPORTS=false" >> $GITHUB_OUTPUT

  build:
    needs: configuration
    if: needs.configuration.outputs.RUN_BUILD == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

  unit-test:
    needs: [configuration, build]
    if: needs.configuration.outputs.RUN_UNIT_TEST == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  instrumented-test:
    needs: [configuration, build]
    if: needs.configuration.outputs.RUN_INSTRUMENTED_TEST == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Instrumented Tests
        run: ./gradlew connectedDebugAndroidTest

  release-signing:
    needs: [configuration, build]
    if: needs.configuration.outputs.RUN_RELEASE_SIGNING == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sign and Assemble Release
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

  test-reports:
    needs: [configuration, unit-test]
    if: needs.configuration.outputs.RUN_TEST_REPORTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Test Reports
        run: ./gradlew jacocoTestReport

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
